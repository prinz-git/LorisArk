services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: "local"
      SECRET_KEY: "change-me"
      DATABASE_URL: "sqlite:////app/data/users.db"
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').getcode() == 200\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    depends_on:
      - api

  api-prod:
    build: .
    profiles: ["prod"]
    ports:
      - "8000:8000"
    environment:
      APP_ENV: "prod"
      SECRET_KEY: "change-me"
      DATABASE_URL: "sqlite:////app/data/users.db"
      WEB_CONCURRENCY: "2"
    volumes:
      - ./data:/app/data
    command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker", "-w", "2", "-b", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').getcode() == 200\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
