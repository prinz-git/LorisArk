name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pre-commit
        run: pre-commit run --all-files

  unit:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: PYTHONPATH=backend pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  qa-api:
    name: QA API Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qa/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install QA dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa
        run: npx playwright install --with-deps

      - name: Start API server
        run: |
          APP_ENV=test \
          SECRET_KEY=ci-secret \
          DATABASE_URL=sqlite:///./test_users.db \
          PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl -sSf http://localhost:8000/docs >/dev/null; then
              echo "API is up";
              exit 0;
            fi
            sleep 1;
          done
          echo "API did not start";
          exit 1

      - name: Run API tests
        working-directory: qa
        env:
          BASE_URL: http://localhost:8000
        run: npx playwright test tests/api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: qa/playwright-report

  qa-ui:
    name: QA UI Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qa/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install QA dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa
        run: npx playwright install --with-deps

      - name: Start API server
        run: |
          APP_ENV=test \
          SECRET_KEY=ci-secret \
          DATABASE_URL=sqlite:///./test_users.db \
          PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl -sSf http://localhost:8000/docs >/dev/null; then
              echo "API is up";
              exit 0;
            fi
            sleep 1;
          done
          echo "API did not start";
          exit 1

      - name: Run UI tests
        working-directory: qa
        env:
          BASE_URL: http://localhost:8000
        run: npx playwright test tests/ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: qa/playwright-report
