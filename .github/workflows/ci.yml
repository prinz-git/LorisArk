name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pre-commit
        run: pre-commit run --all-files

  unit:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: PYTHONPATH=backend pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: lorisark-api
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          tags: lorisark-frontend
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save images
        run: |
          docker save lorisark-api -o /tmp/lorisark-api.tar
          docker save lorisark-frontend -o /tmp/lorisark-frontend.tar

      - name: Upload API image
        uses: actions/upload-artifact@v4
        with:
          name: lorisark-api-image
          path: /tmp/lorisark-api.tar

      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: lorisark-frontend-image
          path: /tmp/lorisark-frontend.tar

  qa-api:
    name: QA API Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qa/package-lock.json

      - name: Install QA dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa
        run: npx playwright install --with-deps

      - name: Download API image
        uses: actions/download-artifact@v4
        with:
          name: lorisark-api-image
          path: /tmp

      - name: Load API image
        run: docker load -i /tmp/lorisark-api.tar

      - name: Start services with Docker Compose
        run: docker compose up -d --no-build api

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/health >/dev/null; then
              echo "API is up";
              exit 0;
            fi
            sleep 1;
          done
          echo "API did not start";
          docker compose ps;
          exit 1

      - name: Run API tests
        working-directory: qa
        env:
          BASE_URL: http://localhost:8000
        run: npx playwright test tests/api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: qa/playwright-report

      - name: Stop services
        if: always()
        run: docker compose down -v

  qa-ui:
    name: QA UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qa/package-lock.json

      - name: Install QA dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa
        run: npx playwright install --with-deps

      - name: Download API image
        uses: actions/download-artifact@v4
        with:
          name: lorisark-api-image
          path: /tmp

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: lorisark-frontend-image
          path: /tmp

      - name: Load images
        run: |
          docker load -i /tmp/lorisark-api.tar
          docker load -i /tmp/lorisark-frontend.tar

      - name: Start services with Docker Compose
        run: docker compose up -d --no-build

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/health >/dev/null; then
              echo "API is up";
              exit 0;
            fi
            sleep 1;
          done
          echo "API did not start";
          docker compose ps;
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..45}; do
            if curl -sSf http://localhost:3000/ >/dev/null; then
              echo "Frontend is up";
              exit 0;
            fi
            sleep 1;
          done
          echo "Frontend did not start";
          docker compose ps;
          exit 1

      - name: Run UI tests
        working-directory: qa
        env:
          BASE_URL: http://localhost:8000
          UI_BASE_URL: http://localhost:3000
        run: npx playwright test tests/ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: qa/playwright-report

      - name: Stop services
        if: always()
        run: docker compose down -v
